# Auto Helper Configuration File
# All paths will be automatically updated with your Windows username

global:
  log_level: "INFO"
  notification_enabled: true
  backup_retention_days: 30

tasks:
  # Task 1: Organize Downloads folder
  - name: "Organize Downloads folder"
    type: "organize_files"
    enabled: true
    schedule: "08:00"
    source: "C:/Users/YourUsername/Downloads"
    organize_by: "extension"
    rules:
      - pattern: "*.pdf|*.doc|*.docx"
        folder: "Documents"
      - pattern: "*.jpg|*.png|*.gif"
        folder: "Images"
      - pattern: "*.mp4|*.mkv|*.avi"
        folder: "Videos"
      - pattern: "*.zip|*.rar|*.7z"
        folder: "Archives"

  # Task 2: Backup important files
  - name: "Backup Documents"
    type: "backup"
    enabled: true
    schedule: "22:00"
    source: "C:/Users/YourUsername/Documents"
    destination: "D:/Backups/Documents"
    compress: true
    skip_patterns:
      - "*.tmp"
      - "~*"
      - ".git"

  # Task 3: Monitor system performance
  - name: "System Performance Monitor"
    type: "monitor"
    enabled: true
    check_interval: 300
    alert_cpu: 80
    alert_memory: 85
    alert_disk: 90
    log_stats: true

  # Task 4: Execute scheduled command
  - name: "Run scheduled script"
    type: "execute_command"
    enabled: false
    schedule: "10:00"
    command: "echo Hello from Auto Helper"

  # Task 5: Clean temporary files
  - name: "Clean temporary files"
    type: "cleanup"
    enabled: true
    schedule: "02:00"
    target_folders:
      - "C:/Windows/Temp"
      - "C:/Users/YourUsername/AppData/Local/Temp"
    file_age_days: 7
    dry_run: false

notifications:
  enabled: true
  on_success: true
  on_error: true
  sound_enabled: true

logging:
  enabled: true
  log_file: "logs/main.log"
  max_file_size_mb: 10
  backup_count: 5
