# 通知设置
notifications:
  enabled: true
  on_success: true   # 成功时通知
  on_error: true     # 失败时通知
  sound_enabled: true

# 日志设置
logging:
  enabled: true
  log_file: "logs/main.log"
  max_file_size_mb: 10
  backup_count: 5
